name: Publish schedule to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "docs/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync deploy to docs
        run: |
          cp deploy/index.html docs/index.html
          touch docs/.nojekyll

      - name: Commit docs sync if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          if git diff --staged --quiet; then
            echo "docs already in sync"
            exit 0
          fi
          git commit -m "ci: sync docs from deploy for GitHub Pages [skip ci]"
          git push
